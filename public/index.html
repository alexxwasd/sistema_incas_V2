<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos de idioma, adaptación a móviles y recursos visuales. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCAS/login</title>
    <!-- Estilos y favicon institucionales. -->
    <link rel="stylesheet" href="CSS/index.css?v=2">
    <link rel="icon" href="resourses/logos/INCAS_logo.png">

</head>
<body>
    <!-- Tarjeta central que reúne los logotipos y los campos del inicio de sesión. -->
    <div class="container">
        <!-- Identidad visual del instituto y del Ministerio de Educación. -->
        <img src="resourses/logos/INCAS_logo.png" alt="INCAS Logo" class="logo_INCAS">
        <img src="resourses/logos/MINED_logo.jpg" alt="MINED Logo" class="logo_MINED">

        <!-- Acceso de usuarios y enlace público al formulario de matrícula. -->
        <h1>Inicio de sesión</h1>

        <!-- El formulario envía correo, NIE o DUI y contraseña a la API de Node.js. -->
        <div class="login-form">
            <form id="admin-login-form">
                <div class="input-group">
                    <label for="username">Correo, NIE o DUI</label>
                    <input type="text" id="username" name="identifier" autocomplete="username" placeholder="Ingrese su correo, NIE o DUI" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="pin" autocomplete="current-password" required>
                </div>
                <!-- El script de acceso intercepta este envío y presenta los errores aquí. -->
                <button class="login-button" type="submit">Iniciar sesión</button>
                <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
            </form>
            <div class="matricula-wrapper">
                <h5 class="matricula-text">Si quieres ser parte de nuestro instituto puedes matricularte aqui</h5>
                <a class="Matricula" href="matricula.html">Matricularse</a>
            </div>
        </div>
    </div>
    <script src="JS/index.js"></script>
</body>
</html>
